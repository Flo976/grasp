<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Grasp : journal des changements">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow2)"/>

  <!-- logo -->
  <g transform="translate(64 44) scale(0.75)">
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="M22 26 L40 44 L58 26" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="56" r="7" fill="#22d3ee"/>
  </g>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="140" y="92" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">journal des changements</text>
    <text x="142" y="128" font-size="20" font-weight="600" fill="url(#accent)">Chaque version, chaque correction, en clair.</text>

    <!-- catégories du journal -->
    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="72" y="186" width="118" height="40" rx="20" fill="#f43f5e" fill-opacity="0.14" stroke="#f43f5e" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="92" cy="206" r="5" fill="#f43f5e"/>
      <text x="139" y="212" fill="#e6e8f5">Rupture</text>
      <rect x="203.5" y="186" width="107" height="40" rx="20" fill="#7c5cff" fill-opacity="0.14" stroke="#7c5cff" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="223.5" cy="206" r="5" fill="#7c5cff"/>
      <text x="265" y="212" fill="#e6e8f5">Ajouté</text>
      <rect x="324.5" y="186" width="118" height="40" rx="20" fill="#5f8bf5" fill-opacity="0.14" stroke="#5f8bf5" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="344.5" cy="206" r="5" fill="#5f8bf5"/>
      <text x="391" y="212" fill="#e6e8f5">Modifié</text>
      <rect x="456.0" y="186" width="118" height="40" rx="20" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="476.0" cy="206" r="5" fill="#22c55e"/>
      <text x="523" y="212" fill="#e6e8f5">Corrigé</text>
      <rect x="587.5" y="186" width="128" height="40" rx="20" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="607.5" cy="206" r="5" fill="#f59e0b"/>
      <text x="660" y="212" fill="#e6e8f5">Sécurité</text>
      <rect x="729.5" y="186" width="170" height="40" rx="20" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="749.5" cy="206" r="5" fill="#22d3ee"/>
      <text x="822" y="212" fill="#e6e8f5">Performances</text>
      <rect x="913.5" y="186" width="180" height="40" rx="20" fill="#9aa3c7" fill-opacity="0.14" stroke="#9aa3c7" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="933.5" cy="206" r="5" fill="#9aa3c7"/>
      <text x="1012" y="212" fill="#e6e8f5">Documentation</text>
    </g>
    <text x="72" y="262" font-size="15" fill="#9aa3c7">Keep a Changelog · SemVer · vérifié à chaque commit (hook, tests, CI)</text>
  </g>
</svg>
