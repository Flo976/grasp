<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Grasp — Chrome piloté par l'arbre d'accessibilité, pour agents IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow2)"/>

  <!-- logo : une main/pince stylisée qui saisit un nœud -->
  <g transform="translate(70 92)">
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M22 26 L40 44 L58 26" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="56" r="7" fill="#22d3ee"/>
  </g>

  <text x="170" y="150" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">grasp</text>
  <text x="72" y="222" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#e6e8f5">Chrome piloté par l'arbre d'accessibilité,</text>
  <text x="72" y="258" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="url(#accent)">pensé pour les agents IA.</text>
  <text x="72" y="316" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#9aa3c7">Pas de captures d'écran · des refs stables · des diffs d'une ligne</text>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="344" width="132" height="34" rx="17" fill="#7c5cff" fill-opacity="0.18" stroke="#7c5cff" stroke-opacity="0.6"/>
    <text x="138" y="366" text-anchor="middle" fill="#c9bcff">CDP direct</text>
    <rect x="216" y="344" width="132" height="34" rx="17" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="282" y="366" text-anchor="middle" fill="#a5f3fc">×48 plus léger</text>
    <rect x="360" y="344" width="132" height="34" rx="17" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="426" y="366" text-anchor="middle" fill="#a7f3d0">WSL2 + Windows</text>
  </g>

  <!-- terminal -->
  <g transform="translate(640 60)">
    <rect width="500" height="300" rx="14" fill="#060914" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="500" height="36" rx="14" fill="#0f1428"/>
    <rect y="22" width="500" height="14" fill="#0f1428"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="6" fill="#febc2e"/>
    <circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="250" y="23" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6b7395">grasp snap</text>
    <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#c8cde6">
      <text x="20" y="70"><tspan fill="#22d3ee">$</tspan> grasp snap</text>
      <text x="20" y="98"><tspan fill="#9aa3c7">page</tspan> <tspan fill="#fcd34d">"Inscription"</tspan></text>
      <text x="20" y="122"><tspan fill="#a78bfa">exo60</tspan>:main</text>
      <text x="36" y="146"><tspan fill="#a78bfa">eua9n</tspan>:heading[1] <tspan fill="#fcd34d">"Inscription"</tspan></text>
      <text x="36" y="170"><tspan fill="#a78bfa">euv3l</tspan>:textbox <tspan fill="#fcd34d">"Nom"</tspan> <tspan fill="#f472b6">[required]</tspan></text>
      <text x="36" y="194"><tspan fill="#a78bfa">e5ld4</tspan>:checkbox <tspan fill="#fcd34d">"J'accepte"</tspan> <tspan fill="#f472b6">[ ]</tspan></text>
      <text x="36" y="218"><tspan fill="#a78bfa">e9kfo</tspan>:button <tspan fill="#fcd34d">"Valider"</tspan></text>
      <text x="20" y="252"><tspan fill="#22d3ee">$</tspan> grasp check e5ld4 --snap-diff</text>
      <text x="20" y="276"><tspan fill="#34d399">~</tspan> <tspan fill="#a78bfa">e5ld4</tspan>:checkbox <tspan fill="#fcd34d">"J'accepte"</tspan> <tspan fill="#34d399">[x]</tspan></text>
    </g>
  </g>
</svg>
